<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leonida Ledger: GTA VI trophy guide &amp; tracker</title>
<meta name="description" content="Offline trophy guide, platinum roadmap and tracker for all 55 Grand Theft Auto VI PS5 trophies.">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/tracker.css">
<link rel="stylesheet" href="css/roadmap.css">
</head>
<body>
<header class="masthead">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <div>
      <h1>Leonida Ledger</h1>
      <p class="brand-sub">GTA VI · PS5 trophy guide &amp; tracker · 55 trophies</p>
    </div>
  </div>
  <div id="summary" class="summary" aria-live="polite"></div>
  <div class="file-actions">
    <button id="export-btn" type="button" class="btn ghost" title="Save your progress to a .json file">Export</button>
    <label class="btn ghost" title="Load a progress file you exported">Import<input id="import-input" type="file" accept="application/json,.json" hidden></label>
  </div>
</header>

<nav class="tabs" aria-label="Views">
  <a href="#/tracker" data-view="tracker" class="tab">Tracker</a>
  <a href="#/roadmap" data-view="roadmap" class="tab">Platinum roadmap</a>
  <a href="#/sources" data-view="sources" class="tab">Sources &amp; method</a>
  <label class="spoiler-switch" title="Hide the names, descriptions and guides of hidden story trophies until you earn them">
    <input id="spoiler-toggle" type="checkbox" checked>
    <span class="switch" aria-hidden="true"></span>
    <span class="switch-label">Spoiler shield</span>
  </label>
</nav>

<main>
  <section id="view-tracker" class="view tracker" data-view="tracker">
    <div class="toolbar">
      <div class="search-row">
      <input id="search" type="search" placeholder="Search trophies, missions, places… ( / )" autocomplete="off" aria-label="Search trophies">
      <div class="selects">
        <select id="grade-filter" aria-label="Grade">
          <option value="all">All grades</option><option value="platinum">Platinum</option><option value="gold">Gold</option><option value="silver">Silver</option><option value="bronze">Bronze</option>
        </select>
        <select id="status-filter" aria-label="Status">
          <option value="all">Earned &amp; to do</option><option value="todo">To do</option><option value="earned">Earned</option>
        </select>
      </div>
      </div>
      <div id="kind-filters" class="chips" role="group" aria-label="Filter by kind"></div>
    </div>
    <div class="split">
      <ol id="trophy-list" class="trophy-list" aria-label="Trophies"></ol>
      <aside id="detail" class="detail" aria-live="polite"></aside>
    </div>
  </section>

  <section id="view-roadmap" class="view roadmap" data-view="roadmap" hidden></section>
  <section id="view-sources" class="view sources" data-view="sources" hidden></section>
</main>

<div id="toast" class="toast" role="status" hidden></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
